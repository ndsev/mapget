name: CI and Deploy

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ '**' ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Serialize manual candidates until upload so two requests cannot choose the same rcN.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/') && format('mapget-rc-{0}', github.ref) || github.run_id }}
  cancel-in-progress: false

jobs:
  determine-version:
    if: |
      (github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)) &&
      (github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install setuptools_scm
        run: |
          python -m pip install --only-binary=:all: setuptools-scm==10.2.1

      - name: Test version validation
        run: python .github/scripts/test_validate_version.py

      # Fail malformed tags and release branches before starting the platform
      # matrix instead of discovering the mismatch in the final deploy job.
      - name: Validate release version
        id: release-version
        run: python .github/scripts/validate_version.py --resolve-candidate


  build-manylinux:
    needs: [determine-version]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        arch: ["x86_64"]
    runs-on: ubuntu-latest
    container: ghcr.io/klebert-engineering/manylinux-cpp17-py${{ matrix.python-version }}-${{ matrix.arch }}:2025.1
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      SCCACHE_GHA_ENABLED: "true"
      # Release correctness is more important than cache speed. The GitHub
      # cache backend can reject sccache reads when its egress quota is busy.
      USE_SCCACHE: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false
      - name: Init submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive --depth=1
      - name: Run sccache-cache
        if: env.USE_SCCACHE == 'true'
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install native build dependencies
        run: |
          yum -y install libuuid-devel java-17-openjdk-headless git-lfs
      - name: Configure
        run: |
          python3 -m venv venv && . ./venv/bin/activate
          pip install -U setuptools wheel pip
          mkdir -p build && cd build
          SCCACHE_ARGS=()
          if [[ "$USE_SCCACHE" == "true" ]]; then
            SCCACHE_ARGS+=(
              -DCMAKE_C_COMPILER_LAUNCHER=sccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            )
          fi
          cmake .. -DCMAKE_BUILD_TYPE=Release "${SCCACHE_ARGS[@]}" \
            -DMAPGET_ENABLE_TESTING=True \
            -DMAPGET_BUILD_EXAMPLES=True \
            -DMAPGET_WITH_WHEEL=True \
            -DMAPGET_WITH_SERVICE=True \
            -DMAPGET_WITH_HTTPLIB=True \
            -DMAPGET_VERSION="${{ needs.determine-version.outputs.version }}" \
            -GNinja
      - name: Build
        run: |
          . ./venv/bin/activate
          cd build
          cmake --build .
          mv bin/wheel bin/wheel-auditme
          auditwheel repair bin/wheel-auditme/mapget*.whl -w bin/wheel
      - name: Test
        timeout-minutes: 30
        run: |
          . ./venv/bin/activate
          cd build
          ctest --verbose --no-tests=error
      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: mapget-py${{ matrix.python-version }}-ubuntu-latest-${{ matrix.arch }}
          path: build/bin/wheel/*.whl

      # The published standalone wheel keeps MCP enabled. Reuse its native
      # dependency build afterward to test product embedders that omit MCP.
      - name: Test MCP-free embedding build
        run: |
          . ./venv/bin/activate
          cmake -S . -B build -DMAPGET_WITH_MCP=OFF -DMAPGET_WITH_WHEEL=OFF
          cmake --build build --target mapget test.mapget
          build/bin/test.mapget '[mcp-build],[HttpDataSource],[DataSourceConfig]'
          ctest --test-dir build -R '^test-mcp-build-cli$' --output-on-failure --no-tests=error

  build-manylinux-aarch64:
    needs: [determine-version]
    if: |
      github.event_name != 'pull_request' ||
      (github.base_ref == 'main' && startsWith(github.head_ref, 'release/'))
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    runs-on: ubuntu-24.04-arm
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      MANYLINUX_IMAGE: ghcr.io/klebert-engineering/manylinux-cpp17-py${{ matrix.python-version }}-aarch64:2025.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false
      - name: Init submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive --depth=1
      - name: Build aarch64 wheel in manylinux container
        timeout-minutes: 60
        run: |
          docker pull "$MANYLINUX_IMAGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e MAPGET_VERSION="${{ needs.determine-version.outputs.version }}" \
            "$MANYLINUX_IMAGE" \
            bash -lc '
              set -euo pipefail
              yum -y install libuuid-devel java-17-openjdk-headless git-lfs
              python3 -m venv venv && . ./venv/bin/activate
              pip install -U setuptools wheel pip
              rm -rf build
              mkdir -p build && cd build
              cmake .. -DCMAKE_BUILD_TYPE=Release \
                -DMAPGET_ENABLE_TESTING=True \
                -DMAPGET_BUILD_EXAMPLES=True \
                -DMAPGET_WITH_WHEEL=True \
                -DMAPGET_WITH_SERVICE=True \
                -DMAPGET_WITH_HTTPLIB=True \
                -DMAPGET_VERSION="$MAPGET_VERSION" \
                -GNinja
              cmake --build .
              mv bin/wheel bin/wheel-auditme
              auditwheel repair bin/wheel-auditme/mapget*.whl -w bin/wheel
              ctest --verbose --no-tests=error
            '
      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: mapget-py${{ matrix.python-version }}-ubuntu-latest-aarch64
          path: build/bin/wheel/*.whl

  build:
    needs: [determine-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
        python-version: ["3.11"]
    env:
      SCCACHE_GHA_ENABLED: "true"
      USE_SCCACHE: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Run sccache-cache
        if: env.USE_SCCACHE == 'true'
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.os == 'macos-15' && 'arm64' || 'x64' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install setuptools wheel ninja
      - name: Build (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          python -m pip install delocate
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export _PYTHON_HOST_PLATFORM="macosx-11.0-$(uname -m)"
          mkdir -p build && cd build
          SCCACHE_ARGS=()
          if [[ "$USE_SCCACHE" == "true" ]]; then
            SCCACHE_ARGS+=(
              -DCMAKE_C_COMPILER_LAUNCHER=sccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            )
          fi
          cmake .. -DCMAKE_BUILD_TYPE=Release "${SCCACHE_ARGS[@]}" \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" \
                -DPython3_ROOT_DIR="$pythonLocation" \
                -DPython3_FIND_FRAMEWORK=LAST \
                -DMAPGET_ENABLE_TESTING=ON \
                -DMAPGET_BUILD_EXAMPLES=ON \
                -DMAPGET_WITH_WHEEL=True \
                -DMAPGET_WITH_SERVICE=True \
                -DMAPGET_WITH_HTTPLIB=True \
                -DMAPGET_VERSION="${{ needs.determine-version.outputs.version }}" \
                -GNinja
          cmake --build .
      - name: Enable Developer Command Prompt (Windows)
        uses: ilammy/msvc-dev-cmd@v1.12.1
        if: matrix.os == 'windows-2022'
      - name: Build (Windows)
        if: matrix.os == 'windows-2022'
        run: |
          # Install NASM and jom using chocolatey (required for OpenSSL build)
          choco install nasm jom -y
          # Add NASM to PATH for current session
          $env:PATH = "$env:PATH;C:\Program Files\NASM"
          # Verify NASM installation
          nasm -v
          echo "cmake -DPython3_ROOT_DIR=$env:pythonLocation"
          mkdir build
          cd build
          $cmakeArgs = @(
            ".."
            "-GNinja"
            "-DCMAKE_BUILD_TYPE=Release"
            "-DPython3_ROOT_DIR=$env:pythonLocation"
            "-DPython3_FIND_REGISTRY=LAST"
            "-DMAPGET_ENABLE_TESTING=YES"
            "-DMAPGET_BUILD_EXAMPLES=YES"
            "-DMAPGET_WITH_WHEEL=True"
            "-DMAPGET_WITH_SERVICE=True"
            "-DMAPGET_WITH_HTTPLIB=True"
            "-DMAPGET_VERSION=${{ needs.determine-version.outputs.version }}"
          )
          if ($env:USE_SCCACHE -eq "true") {
            $cmakeArgs += "-DCMAKE_C_COMPILER_LAUNCHER=sccache"
            $cmakeArgs += "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          }
          cmake @cmakeArgs
          cmake --build . --config Release
      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: mapget-py${{ matrix.python-version }}-${{ matrix.os }}
          path: build/**/bin/wheel/*.whl
      - name: Test
        timeout-minutes: 30
        run: |
          cd build
          ctest -C Release --verbose --no-tests=error

  test-shared-wheel:
    name: Install the same Linux wheel on CPython ${{ matrix.python-version }}
    needs: [determine-version, build-manylinux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: mapget-py3.11-ubuntu-latest-x86_64
          path: dist
      - name: Audit the stable Python ABI
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install --only-binary=:all: abi3audit==0.0.26
          abi3audit --strict dist/*.whl
      - name: Install and exercise the repaired stable-ABI wheel
        env:
          WHEEL_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          test -f dist/mapget-*-cp310-abi3-*.whl
          # Select only the artifact from this run, even if its version is on PyPI.
          python -m pip install --only-binary=:all: --no-index --find-links dist --no-deps "mapget==$WHEEL_VERSION"
          python -m pip install --only-binary=:all: "mapget==$WHEEL_VERSION"
          python -m pip check
          python test/integration/python-bindings-smoke.py

  deploy:
    needs: [determine-version, build-manylinux, build-manylinux-aarch64, build, test-shared-wheel]
    if: |
      (github.event_name == 'release' && github.event.action == 'published' &&
       !github.event.release.draft && !github.event.release.prerelease &&
       github.ref == format('refs/tags/{0}', github.event.release.tag_name)) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install release validation and upload tools
        run: |
          python -m pip install --only-binary=:all: setuptools-scm==10.2.1 twine==7.0.0
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mapget-py*
          path: dist/
      
      - name: Consolidate wheels
        run: |
          echo "Downloaded artifacts structure:"
          find dist/ -type f -name "*.whl"
          
          # Move all wheels to dist/ root
          mkdir -p dist_consolidated
          find dist/ -name "*.whl" -type f -exec mv {} dist_consolidated/ \;
          rm -rf dist
          mv dist_consolidated dist
          
          echo "Consolidated wheels:"
          ls -la dist/
      
      - name: Verify package version before upload
        env:
          WHEEL_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          python .github/scripts/validate_version.py --check-upload "$WHEEL_VERSION"
          twine check --strict dist/*.whl

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.KE_PYPI_TOKEN }}
        run: |
          twine upload \
            --non-interactive \
            --skip-existing \
            --verbose \
            --disable-progress-bar \
            dist/*.whl
